# CSX4110 Project 02: Anubis demo
#
#   visitor -> Anubis (port 8888 on your laptop) -> nginx (the DevPortal website)
#
# Only Anubis has a port you can reach. nginx has none, so every visitor
# has to go through Anubis first.

services:
  anubis:
    image: ghcr.io/techarohq/anubis:v1.27.0
    container_name: demo-anubis
    environment:
      BIND: ":8080"                          # Anubis listens on port 8080 inside its container
      # Anubis usually runs behind nginx or Caddy, which tell it the visitor's
      # IP address in the X-Real-Ip header. Nothing sits in front of it here,
      # so it has to read the IP from the connection itself. Without this line,
      # every request fails with HTTP 500 "administrator has misconfigured Anubis".
      USE_REMOTE_ADDRESS: "true"
      TARGET: "http://devportal:80"          # where to send visitors who get in
      POLICY_FNAME: "/data/cfg/botPolicies.yaml"   # our rules file
      METRICS_BIND: ":9090"                  # Prometheus metrics (not used in the demo)
      SERVE_ROBOTS_TXT: "true"               # Anubis serves its own robots.txt for polite bots
      # This key signs the cookie a browser gets after it solves the puzzle.
      # It is written here for the demo only. In a real system, make your own
      # with `openssl rand -hex 32` and keep it secret.
      ED25519_PRIVATE_KEY_HEX: "f7e3b1a90c2d4e6f8a0b1c2d3e4f50617283949a5b6c7d8e9f0a1b2c3d4e5f60"
    volumes:
      - ./botPolicies.yaml:/data/cfg/botPolicies.yaml:ro   # put our rules inside the container, read only
    ports:
      - "8888:8080"   # port 8888 on your laptop -> Anubis port 8080
      - "9091:9090"   # metrics
    depends_on:
      - devportal     # start nginx first

  # The website we protect. It stands in for our Gitea and docs portal.
  devportal:
    image: nginx:alpine
    container_name: demo-devportal
    volumes:
      - ./www:/usr/share/nginx/html:ro   # our HTML pages, read only
    # No `ports:` on purpose, so nobody can reach nginx without going through Anubis.
