# ============================================================================
#  Bot rules for DevPortal (CSX4110 Project 02)
# ============================================================================
#  Anubis reads the `bots:` list from top to bottom.
#    ALLOW = let the visitor in, stop reading
#    DENY  = block the visitor, stop reading
#    WEIGH = add points to the visitor's score, keep reading
#
#  After the list, the `thresholds:` part at the bottom turns the score into
#  a result: let in, easy puzzle or hard puzzle.
# ============================================================================

bots:
  # --- Rule packs that come with Anubis --------------------------------------

  # Bots Anubis already knows are bad, including headless browsers
  # (HeadlessChrome) and some scrapers that run on cloud servers. -> DENY
  - import: (data)/bots/_deny-pathological.yaml

  # AI bots of every kind: training crawlers (GPTBot, ClaudeBot), AI search
  # bots (PerplexityBot) and AI assistants reading a page for a user
  # (ChatGPT-User). -> DENY
  # Anubis also has softer versions: ai-block-moderate.yaml and
  # ai-block-permissive.yaml.
  - import: (data)/meta/ai-block-aggressive.yaml

  # Search engines we want: Google, Bing, DuckDuckGo, Internet Archive and
  # others. -> ALLOW
  # Anubis checks that the request really comes from that company, not just
  # the name tag, so a fake Googlebot does not get in for free.
  - import: (data)/crawlers/_allow-good.yaml

  # /robots.txt, /favicon.ico and /.well-known/ must never get a puzzle,
  # otherwise certificate renewal (ACME) and feed readers stop working.
  - import: (data)/common/keep-internet-working.yaml

  # --- Our own rules ---------------------------------------------------------

  # 1. Our REST API is used by CI runners and the mobile app. They cannot run
  #    JavaScript, so they can never solve the puzzle. We have to let them in
  #    with a rule, or we lock out our own clients.
  #    All three lines must be true. The middle line checks that the header
  #    exists first, because reading a missing header is an error.
  - name: allow-devportal-api
    action: ALLOW
    expression:
      all:
        - 'path.startsWith("/api/")'
        - '"Accept" in headers'
        - 'headers["Accept"] == "application/json"'

  # 2. Let `git clone` in without a puzzle.
  - name: allow-git-clients
    action: ALLOW
    expression: userAgent.startsWith("git/")

  # 3. Our pain point. These pages run git and database work with no cache,
  #    and the scrapers were reading all of them. Adding 20 points means a
  #    browser-like visitor gets the hard puzzle here. One person opening one
  #    diff hardly notices. A scraper that keeps dropping its cookie pays on
  #    every page.
  - name: expensive-generated-pages
    action: WEIGH
    expression:
      any:
        - 'path.startsWith("/blame/")'
        - 'path.startsWith("/commit/")'
        - 'path.startsWith("/search")'
    weight:
      adjust: 20

  # 4. A name tag with "Mozilla" or "Opera" in it looks like a browser, so it
  #    gets 10 points. Almost every browser's name tag starts with
  #    "Mozilla/5.0", and so do the scrapers that pretend to be Chrome, which
  #    is the problem we are solving. curl, wget and CCBot do not match, so
  #    they stay at 0 points.
  - name: generic-browser
    action: WEIGH
    user_agent_regex: >-
      Mozilla|Opera
    weight:
      adjust: 10

# ============================================================================
#  Thresholds: score -> result
# ============================================================================
thresholds:
  # 0 points: let in with no puzzle. curl, wget and CCBot end up here.
  - name: minimal-suspicion
    expression: weight <= 0
    action: ALLOW

  # 1 to 29 points (a browser on a normal page): easy puzzle.
  # "fast" = SHA-256 proof of work that uses all CPU cores.
  # difficulty N = the hash has to start with N zeros in hex, so it takes
  # about 16^N tries on average. Each +1 is 16 times more work, not 2 times.
  #   difficulty 2 = about 256 tries, instant
  - name: normal-browsing
    expression:
      all:
        - weight > 0
        - weight < 30
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 2

  # 30 points or more (browser 10 + expensive page 20): hard puzzle.
  #   difficulty 5 = about 1,048,576 tries, 4 to 8 seconds on a laptop
  #   (we measured 4.5 s)
  # The visitor pays once, then the cookie covers the rest of the session.
  #
  # We tried difficulty 6 first. That is 16 times more work again (about
  # 16.7 million tries), and a real browser was still working after two
  # minutes, so we went back to 5. Choosing this number is the main decision
  # when you set up Anubis.
  - name: expensive-page-scraping
    expression: weight >= 30
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 5

# Keep puzzle data in memory. If Anubis restarts, it forgets them, which is
# fine for a demo. A real setup with several Anubis servers would use a
# shared store such as Valkey or Redis.
store:
  backend: memory
  parameters: {}

# Send HTTP 200 even when showing a puzzle or blocking, not 403. It looks
# wrong, but aggressive scrapers keep retrying after a 4xx and stop after a
# 200. This is Anubis's default.
status_codes:
  CHALLENGE: 200
  DENY: 200

# Left on from Anubis's default config. We did not use it in the demo.
honeypot:
  enabled: true
  implementation: naive
